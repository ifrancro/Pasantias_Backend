spring.application.name=herbalife_clubes
# Puerto: usa PORT de Render si está disponible, sino 9090
server.port=${PORT:9090}

# Base de datos PostgreSQL
# En producción (Render), estas variables se configuran automáticamente
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/HerbalifeClubesDB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Hibernate NO es dueño del esquema. Solo valida contra entidades.
# Requiere que Flyway (o baseline + migrate) deje el esquema al día.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ============================================
# Flyway
# ============================================
# Migraciones en classpath:db/migration (V2…V14; no hay V1 histórico).
# En bases YA existentes sin flyway_schema_history (creadas con ddl-auto=update):
#   1) Backup
#   2) FLYWAY_BASELINE_ON_MIGRATE=true  (una sola vez)
#   3) FLYWAY_BASELINE_VERSION=12
#   4) Arrancar → baseline V12 + aplica V13 y posteriores
#   5) Quitar FLYWAY_BASELINE_ON_MIGRATE (dejar false)
# Nunca usar flyway clean en producción.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:12}

# Jackson Configuration (para evitar errores de serialización)
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.paths-to-match=/api/**
springdoc.show-actuator=false
springdoc.use-management-port=false
springdoc.packages-to-scan=com.example.herbalife_clubes.controllers

# ============================================
# Configuración de Correo (SMTP)
# ============================================
# Configurar estas variables de entorno en producción (Render):
#   MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================
# Configuración de Verificación por Email
# ============================================
app.name=Nutrilife Club
app.verification.code-length=6
app.verification.expiration-minutes=15
app.verification.max-resends=5
